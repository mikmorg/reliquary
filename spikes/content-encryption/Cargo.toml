[package]
name = "reliquary-enc-spike"
version = "0.2.0"
edition = "2021"
publish = false
description = "THROWAWAY SPIKE: resumable age-v1 content encryption for Reliquary. Not production code."

[dependencies]
# RustCrypto 2026 generation: sha2 0.11 detects the ARMv8 SHA-2 extension at
# runtime, chacha20 0.10 uses NEON on aarch64 by default. poly1305 0.9 still has
# no ARM SIMD backend (see the research note).
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
chacha20poly1305 = "0.11"
aes-gcm = "0.11"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
base64 = "0.22"
bech32 = "0.9"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zeroize = "1"
# Used only as an independent Rust decryptor (homelab ingest + verification).
age = "0.11.5"

[profile.release]
debug = false
