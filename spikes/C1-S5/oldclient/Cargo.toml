[package]
name = "oldclient"
version = "1.2.0"
edition = "2021"
publish = false

# C1-S5 throwaway: a "v1.2.0" client compiled against the v1 schema, run against later server generations.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "2", default-features = false, features = ["json"] }
