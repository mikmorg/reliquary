[package]
name = "reliquary-ios-shape"
version = "0.1.0"
edition = "2021"
publish = false
description = "THROWAWAY SPIKE B4-S1: shape of a Rust core API that an iOS Swift shell can drive (UniFFI). Not production code."

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "reliquary_ios_shape"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[features]
default = ["bundled-sqlite"]
# Linux runs use SQLite compiled from source. iOS builds use the system libsqlite3
# (the final link happens in Xcode), so they build with --no-default-features.
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
uniffi = "0.32"
rusqlite = "0.40"
chacha20poly1305 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
debug = false
